# Configurazione di deploy su Netlify.
# Le chiavi API non stanno qui: si impostano in
# Site configuration → Environment variables (vedi .env.example).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Reindirizzamenti
# ---------------------------------------------------------------------------

# URL parlante per la funzione del modulo contatti.
[[redirects]]
  from = "/api/contatti"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Una sola forma canonica dell'URL: quella senza slash finale.
# Evita che /servizi e /servizi/ siano indicizzate come pagine diverse.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Intestazioni di sicurezza
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # challenges.cloudflare.com serve solo il widget antispam della pagina
    # contatti: è l'unico dominio terzo previsto dal sito.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# I file con impronta nel nome possono restare in cache per un anno.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
